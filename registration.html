<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <table class="container">
        <tr>
          
            <td class="left-banner">
                <h1>Let's Get Started</h1>
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                    Maecenas placerat ultricies libero eu pharetra.
                    Vestibulum a ultrices augue.
                </p>
            </td>
            <td class="right-form">
                <h2>Sign up</h2>

                <form>
                    <table class="form-table">

                        <tr>
                            <td class="form-group">
                                <input type="text" placeholder="Your name" required>
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <input type="email" placeholder="Your Email" required>
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <input type="password" placeholder="Create Password" required>
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <input type="password" placeholder="Repeat password" required>
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <input type="tel" placeholder="Phone Number">
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <input type="number" placeholder="Age">
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <label>Document:</label>
                                <input type="file">
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <label>Gender:</label>
                                <table class="inline-table">
                                    <tr>
                                        <td>
                                            <label>
                                                <input type="radio" name="Gender" value="male">
                                                Male
                                            </label>
                                        </td>
                                        <td>
                                            <label>
                                                <input type="radio" name="Gender" value="female">
                                                Female
                                            </label>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td class="form-group">
                                <label>Courses:</label>
                                <table class="inline-table">
                                    <tr>
                                        <td>
                                            <label>
                                                <input type="checkbox" name="course" value="OOP">
                                                OOP
                                            </label>
                                        </td>
                                        <td>
                                            <label>
                                                <input type="checkbox" name="course" value="C#">
                                                C#
                                            </label>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td class="form-group">
                                <label>Department:</label>
                                <select name="department">
                                    <option value="">Select Department</option>
                                    <option value="CSE">CSE</option>
                                    <option value="EEE">EEE</option>
                                    <option value="BBA">BBA</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td class="form-group">
                                <textarea placeholder="Comment / Message" rows="2"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <button type="submit">Sign up</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="footer-text">
                                Already have account?
                                <a href="../OCT 15/login.html">Sign in here</a>
                            </td>
                        </tr>

                    </table>
                </form>
                
            </td>
        </tr>
    </table>

</body>

</html>
